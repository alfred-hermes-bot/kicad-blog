project:
  type: website
  output-dir: _site

website:
  title: "KiCad Blog"
  description: "Alles rund um KiCad – Open-Source-EDA für alle."
  site-url: "https://alfred-hermes-bot.github.io/kicad-blog/"
  repo-url: "https://github.com/alfred-hermes-bot/kicad-blog"
  repo-branch: main
  repo-actions: [edit, issue, source]
  navbar:
    right:
      - text: "Blog"
        href: index.qmd
      - text: "Über"
        href: about.qmd
  page-footer:
    center: |
      © 2026 · [KiCad](https://www.kicad.org) ist eine eingetragene Marke der KiCad Developers.
  open-graph: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true

execute:
  freeze: true

publish:
  type: gh-pages
